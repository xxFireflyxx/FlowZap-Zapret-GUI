# Встроенные DNS-серверы FlowZap. FlowZap скачивает этот файл при запуске
# (core/dns/builtin.py). Пары можно добавлять, менять и удалять — у
# пользователей изменится так же. После любого изменения увеличьте version:
# список с номером меньше уже применённого игнорируется.
# id — постоянный ключ пары (не меняйте), name — как её видит пользователь.
# Первая пара станет активной у нового пользователя; у остальных порядок не меняется.

version = 2

[[dns]]
id = "by"
name = "Беларусский"
ipv4_main = "143.20.64.55"
ipv4_backup = "91.108.243.78"

[[dns]]
id = "xbox"
name = "xbox-dns"
ipv4_main = "111.88.96.54"
ipv4_backup = "111.88.96.55"
ipv6_main = "2a00:ab00:1233:26::50"
ipv6_backup = "2a00:ab00:1233:26::51"

[[dns]]
id = "reserve"
name = "Резерв"
ipv4_main = "159.94.200.33"
ipv4_backup = "193.233.112.67"
